
[functions.ingest-telemetry]
enabled = true
# Requires a valid Supabase Auth JWT (Authorization: Bearer <access_token>).
# The function itself additionally checks the caller's role is
# 'operator' or 'admin' before writing anything (see index.ts).
verify_jwt = true
import_map = "./functions/ingest-telemetry/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ingest-telemetry/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ingest-telemetry/*.html" ]
